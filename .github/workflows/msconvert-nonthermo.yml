# Off-box x86-64 FULL pipeline for vendor RAW this Apple-Silicon Mac cannot convert:
#   download vendor RAW -> msconvert (wine, native x86) -> mzML -> OUR converter -> mzPeak.
#
# WHY: msconvert (Windows-only, run under wine) CRASHES under qemu on Apple Silicon, and
# Docker Desktop won't engage Rosetta here. GitHub `ubuntu-latest` is native x86-64, so wine
# runs without emulation and every vendor reader works. We also build mzml2mzpeak on the
# runner and do mzML->mzPeak there, so we upload ONLY the (much smaller) mzPeak instead of a
# multi-GB profile mzML. All three byte sizes are printed to the job log for the size benchmark.
#
# Trigger: manual (workflow_dispatch). `only=<name>` converts a single matrix leg.

name: msconvert-nonthermo (x86 off-box -> mzPeak)

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: convert a single matrix name (blank = all)"
        required: false
        default: ""
      inten:
        description: "Intensity bit depth (32 or 64); m/z stays 64-bit"
        required: false
        default: "64"
      keep_mzml:
        description: "Keep + upload the profile mzML.gz (true). Set false for large files whose huge profile mzML overflows the runner disk (the mzpeak still converts + uploads)."
        required: false
        default: "true"

jobs:
  convert:
    runs-on: ubuntu-latest   # native x86-64 -> wine works, no qemu
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: waters-synapt-MTBLS767
            url: "https://ftp.ebi.ac.uk/pub/databases/metabolights/studies/public/MTBLS767/FILES/2090_V_T424-72_MSMS45_P_J_180407_4.raw.zip"
          - name: bruker-microtof-q2-MTBLS2
            url: "https://ftp.ebi.ac.uk/pub/databases/metabolights/studies/public/MTBLS2/FILES/MSpos-Ex1-cyp79-48h-Ag-2_1-B%2C2_01_9821.d.zip"
          - name: bruker-impact-ii-PXD071586
            url: "https://ftp.pride.ebi.ac.uk/pride/data/archive/2026/01/PXD071586/4928_QTOF1_32IS_sample_03_BB8_01_63101.d.zip"
          - name: agilent-6460-qqq-MTBLS253
            url: "https://ftp.ebi.ac.uk/pub/databases/metabolights/studies/public/MTBLS253/FILES/17.zip"
          - name: agilent-6560-imqtof-MTBLS427
            url: "https://ftp.ebi.ac.uk/pub/databases/metabolights/studies/public/MTBLS427/FILES/20150813_1_pos_HL.d.zip"
          - name: agilent-gc-5977-Z3249821
            url: "https://zenodo.org/api/records/3249821/files/PARFUM%20MS.zip/content"
          # --- TOF-grid examples (for the grid-encoding eval) ---
          # SciEx TripleTOF 6600 SWATH/DIA. We do NOT peak-pick; the "Verify spectrum mode" step records
          # profile-vs-centroid in the run summary. msconvert's SciEx reader returns these vendor-centroided
          # (profile=0), so `allow_centroid: true` keeps the (centroid) mzML + mzpeak instead of failing —
          # whatever profile spectra survive are still labeled profile. Two-file format (.wiff + .wiff.scan).
          - name: sciex-tripletof6600-swath-MSV000090684
            wiff_name: "11410_DGCR8_CBF_BR2_BioID_20181022_TOF6600_SWATH.wiff"
            url: "https://massive.ucsd.edu/ProteoSAFe/DownloadResultFile?file=f.MSV000090684/raw/RAW/11410_DGCR8_CBF_BR2_BioID_20181022_TOF6600_SWATH.wiff&forceDownload=true"
            scan_url: "https://massive.ucsd.edu/ProteoSAFe/DownloadResultFile?file=f.MSV000090684/raw/RAW/11410_DGCR8_CBF_BR2_BioID_20181022_TOF6600_SWATH.wiff.scan&forceDownload=true"
            allow_centroid: "true"
          - name: sciex-tripletof6600-swath-PXD011326
            wiff_name: "VD_170826_SWATH_6600_PD_15.wiff"
            url: "https://ftp.pride.ebi.ac.uk/pride/data/archive/2019/12/PXD011326/VD_170826_SWATH_6600_PD_15.wiff"
            scan_url: "https://ftp.pride.ebi.ac.uk/pride/data/archive/2019/12/PXD011326/VD_170826_SWATH_6600_PD_15.wiff.scan"
            allow_centroid: "true"
          - name: sciex-tripletof6600-swath-MSV000090136
            wiff_name: "17_16_hpr56_ko_YMR295C_4444_-0.04.wiff"
            url: "https://massive.ucsd.edu/ProteoSAFe/DownloadResultFile?file=f.MSV000090136/raw/plate56/17_16_hpr56_ko_YMR295C_4444_-0.04.wiff&forceDownload=true"
            scan_url: "https://massive.ucsd.edu/ProteoSAFe/DownloadResultFile?file=f.MSV000090136/raw/plate56/17_16_hpr56_ko_YMR295C_4444_-0.04.wiff.scan&forceDownload=true"
            allow_centroid: "true"
          - name: sciex-tripletof6600-swath-MSV000093587
            wiff_name: "Sample049.wiff"
            url: "https://massive.ucsd.edu/ProteoSAFe/DownloadResultFile?file=f.MSV000093587/raw/Sample049.wiff&forceDownload=true"
            scan_url: "https://massive.ucsd.edu/ProteoSAFe/DownloadResultFile?file=f.MSV000093587/raw/Sample049.wiff.scan&forceDownload=true"
            allow_centroid: "true"
          # Three-file SciEx run (.wiff + .wiff.scan + .wiff2): `wiff2_url` adds the optional third file.
          - name: sciex-tripletof6600-swath-PXD071869
            wiff_name: "08_SWATH_1E_1H.wiff"
            url: "https://ftp.pride.ebi.ac.uk/pride/data/archive/2026/01/PXD071869/08_SWATH_1E_1H.wiff"
            scan_url: "https://ftp.pride.ebi.ac.uk/pride/data/archive/2026/01/PXD071869/08_SWATH_1E_1H.wiff.scan"
            wiff2_url: "https://ftp.pride.ebi.ac.uk/pride/data/archive/2026/01/PXD071869/08_SWATH_1E_1H.wiff2"
            allow_centroid: "true"
          # Bruker microTOF-Q Max (.baf inside a .d folder, zip-delivered). README mislabels it Agilent;
          # contents are Bruker BAF. msconvert's Bruker reader handles it; mode recorded by the verify step.
          # NOTE: lysate_000008.d.zip (3.87 GB BAF) deterministically OOMs/disk-fills the hosted runner
          # while writing the profile mzML (confirmed 2x). Swapped to a small MS1 (full-scan, profile)
          # run from the same study — converts within hosted limits and is ideal for the grid eval.
          - name: bruker-microtofq-PXD059108
            url: "https://ftp.pride.ebi.ac.uk/pride/data/archive/2025/12/PXD059108/den_pierce_0pt2ug_MS1_1.d.zip"
            allow_centroid: "true"
          # Agilent QTOF .d.zip. These two are CENTROID-ONLY at source (PXD059765 has no MSProfile.bin;
          # PXD041903's MSProfile.bin is 0 bytes) — msconvert can only emit centroid. `allow_centroid: true`
          # makes the "Verify PROFILE" step WARN (not fail) so the centroid mzML + mzpeak are still produced.
          - name: agilent-qtof-PXD059765
            url: "https://ftp.pride.ebi.ac.uk/pride/data/archive/2025/05/PXD059765/CON1_2.d.zip"
            allow_centroid: "true"
          - name: agilent-qtof-PXD041903
            url: "https://ftp.pride.ebi.ac.uk/pride/data/archive/2025/05/PXD041903/20190423_Alex7.d.zip"
            allow_centroid: "true"
    steps:
      - name: Gate (single-leg select)
        id: gate
        run: |
          if [ -n "${{ github.event.inputs.only }}" ] && [ "${{ github.event.inputs.only }}" != "${{ matrix.name }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Free disk space (room for multi-GB mzML)
        if: steps.gate.outputs.skip == 'false'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1

      - name: Checkout (need the crate to build the converter)
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Build mzml2mzpeak (release)
        if: steps.gate.outputs.skip == 'false'
        run: |
          rustup show || true   # rust-toolchain.toml pins 1.96.0; cargo auto-installs it
          cargo build --release --bin mzml2mzpeak
          ls -lh target/release/mzml2mzpeak

      - name: Download vendor RAW
        if: steps.gate.outputs.skip == 'false'
        env:
          URL: ${{ matrix.url }}
          SCAN_URL: ${{ matrix.scan_url }}
          WIFF2_URL: ${{ matrix.wiff2_url }}
          WIFF_NAME: ${{ matrix.wiff_name }}
        run: |
          set -euo pipefail
          mkdir -p work
          if [ -n "$SCAN_URL" ]; then
            # Sciex multi-file format: download .wiff + .wiff.scan (+ optional .wiff2) with their real
            # names so msconvert finds the siblings next to the .wiff. No zip to extract.
            curl -fSL --retry 5 -o "work/$WIFF_NAME"      "$URL"
            curl -fSL --retry 5 -o "work/$WIFF_NAME.scan" "$SCAN_URL"
            if [ -n "$WIFF2_URL" ]; then
              curl -fSL --retry 5 -o "work/${WIFF_NAME}2" "$WIFF2_URL"   # e.g. foo.wiff -> foo.wiff2
            fi
            ls -lh work/
          else
            curl -fSL --retry 5 -o work/payload "$URL"
            ls -lh work/payload
          fi

      - name: Extract + locate vendor file
        if: steps.gate.outputs.skip == 'false'
        id: locate
        env:
          SCAN_URL: ${{ matrix.scan_url }}
          WIFF_NAME: ${{ matrix.wiff_name }}
        run: |
          set -euo pipefail
          cd work
          if [ -n "$SCAN_URL" ]; then
            # Sciex: the .wiff is the target directly (its .scan sibling is alongside).
            echo "Found: $WIFF_NAME"; echo "target=work/$WIFF_NAME" >> "$GITHUB_OUTPUT"
          else
            unzip -q payload || (mv payload payload.zip && unzip -q payload.zip)
            rm -f payload payload.zip
            # Locate the vendor file/dir. Prefer an exact *.d / *.raw; else an Agilent/Bruker dir holding
            # an AcqData/ (handles Windows "<name>.d - Copy" deposits whose dir name doesn't end in .d);
            # else a .wiff.
            target="$(find . -maxdepth 3 \( -iname '*.d' -o -iname '*.raw' \) | head -1)"
            if [ -z "$target" ]; then
              acq="$(find . -maxdepth 4 -type d -iname 'AcqData' | head -1)"
              [ -n "$acq" ] && target="$(dirname "$acq")"
            fi
            [ -z "$target" ] && target="$(find . -maxdepth 3 -iname '*.wiff' -type f | head -1)"
            if [ -z "$target" ]; then echo "No vendor file:"; find . -maxdepth 3; exit 1; fi
            # Normalize a vendor directory whose name doesn't end in .d (e.g. "<name>.d - Copy") so the
            # reader recognizes it by extension.
            if [ -d "$target" ]; then
              base="$(basename "$target")"; base="${base% - Copy}"
              case "$base" in *.d) : ;; *) base="$base.d";; esac
              nd="$(dirname "$target")/$base"
              if [ "$target" != "$nd" ]; then mv "$target" "$nd"; target="$nd"; echo "normalized vendor dir -> $target"; fi
            fi
            # Bruker BAF repair: some PRIDE deposits rename analysis.baf -> <prefix>_analysis.baf while
            # keeping the standard analysis.baf_idx/xtr/sqlite companions, which makes msconvert's Bruker
            # reader emit "[ReaderFail] don't know how to read". If the .d has a *.baf but no analysis.baf,
            # restore the canonical name so the reader (and its sqlite cache) line up.
            if [ -d "$target" ] && [ ! -e "$target/analysis.baf" ]; then
              baf="$(find "$target" -maxdepth 1 -iname '*.baf' | head -1)"
              if [ -n "$baf" ]; then
                mv "$baf" "$target/analysis.baf"
                echo "Bruker BAF repair: $(basename "$baf") -> analysis.baf"
              fi
            fi
            echo "Found: $target"; echo "target=work/$target" >> "$GITHUB_OUTPUT"
          fi

      - name: msconvert (wine, native x86) -> mzML
        if: steps.gate.outputs.skip == 'false'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/work":/work \
            chambm/pwiz-skyline-i-agree-to-the-vendor-licenses \
            wine msconvert "/${{ steps.locate.outputs.target }}" \
              -o /work --outfile local.mzML --mzML --mz64 --inten${{ github.event.inputs.inten }} --zlib
          ls -lh work/local.mzML

      - name: Verify spectrum mode (fail on centroid unless allow_centroid)
        if: steps.gate.outputs.skip == 'false'
        env:
          ALLOW_CENTROID: ${{ matrix.allow_centroid }}
        run: |
          set -euo pipefail
          # Count spectrum-mode cvParams in the mzML head (enough to see the dominant mode without
          # scanning the whole multi-GB file). MS:1000128 = profile spectrum, MS:1000127 = centroid.
          head -c 200000000 work/local.mzML > work/_head.xml || true
          # `|| true` is REQUIRED: under `set -euo pipefail`, grep exits 1 when it finds ZERO matches,
          # and pipefail propagates that — which previously ABORTED this whole step before the
          # profile/centroid logic (and the allow_centroid branch) ever ran, so centroid output looked
          # like a hard gate crash instead of a clean centroid verdict. Guard so 0 matches -> "0".
          prof=$(grep -o 'MS:1000128' work/_head.xml | wc -l | tr -d ' ' || true)
          cent=$(grep -o 'MS:1000127' work/_head.xml | wc -l | tr -d ' ' || true)
          prof=${prof:-0}; cent=${cent:-0}
          rm -f work/_head.xml
          echo "profile-spectrum cvParams: $prof   centroid-spectrum cvParams: $cent"
          {
            echo "### ${{ matrix.name }} — spectrum mode"
            echo "profile cvParams: $prof, centroid cvParams: $cent"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$prof" -eq 0 ] || [ "$cent" -gt "$prof" ]; then
            if [ "$ALLOW_CENTROID" = "true" ]; then
              echo "::warning::Output is CENTROID (profile=$prof centroid=$cent). Allowed for this leg (centroid-only source) — producing centroid mzML + mzpeak."
              echo "spectrum mode: CENTROID (allowed)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Output is NOT profile (profile=$prof centroid=$cent). This dataset is centroided; aborting per the profile-only requirement."
              exit 1
            fi
          else
            echo "OK: profile data confirmed."
          fi

      - name: mzML -> mzPeak (our converter); optionally keep the profile mzML
        if: steps.gate.outputs.skip == 'false'
        env:
          KEEP_MZML: ${{ github.event.inputs.keep_mzml }}
        run: |
          set -euo pipefail
          ./target/release/mzml2mzpeak work/local.mzML "work/${{ matrix.name }}.mzpeak"
          ls -lh "work/${{ matrix.name }}.mzpeak"
          if [ "$KEEP_MZML" = "true" ]; then
            # Keep the PROFILE mzML. gzip in place (-f replaces the original). NOTE: for very large
            # profile mzML (multi-GB raw) this can exhaust the runner disk — pass keep_mzml=false then.
            gzip -f work/local.mzML
            mv work/local.mzML.gz "work/${{ matrix.name }}.mzML.gz"
            ls -lh "work/${{ matrix.name }}.mzML.gz"
          else
            rm -f work/local.mzML   # free the huge profile mzML; ship only the mzpeak
            echo "keep_mzml=false — dropped the profile mzML (avoids runner disk overflow on large files)"
          fi

      - name: Size summary (for the benchmark)
        if: steps.gate.outputs.skip == 'false'
        run: |
          mp=$(stat -c%s "work/${{ matrix.name }}.mzpeak" 2>/dev/null || echo 0)
          mg=$(stat -c%s "work/${{ matrix.name }}.mzML.gz" 2>/dev/null || echo 0)
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "mzPeak bytes: $mp ; profile mzML.gz bytes: $mg" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mzPeak + profile mzML artifact
        if: steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: mzpeak-${{ matrix.name }}
          path: |
            work/${{ matrix.name }}.mzpeak
            work/${{ matrix.name }}.mzML.gz
          if-no-files-found: error
          retention-days: 7
