[package]
name = "mzml2mzpeak"
version = "0.1.0"
edition = "2024"
# True MSRV floor: mzpeak_prototyping@d1aaaf84 uses stdlib APIs stabilized in 1.87
# (io_error_more, const String::as_bytes). 1.85 is only edition-2024's floor, not the
# build floor. The project pins/tests 1.96.0 via rust-toolchain.toml.
rust-version = "1.87"

# The crate is now a LIBRARY consumed by the bins (spike_coords, verify_ibd) and the
# Phase 4 writer. The [[bin]] targets and src/main.rs remain; this only adds the lib face.
[lib]
name = "mzml2mzpeak"
path = "src/lib.rs"

# The other bins (spike_coords, verify_ibd) are auto-discovered under src/bin/; declare
# the preflight bin explicitly so CARGO_BIN_EXE_preflight is unambiguous for the spawned
# integration tests.
[[bin]]
name = "preflight"
path = "src/bin/preflight.rs"

# The converter CLI (Plan 06-02). Declared explicitly so CARGO_BIN_EXE_mzml2mzpeak is
# unambiguous for the spawned-process integration tests (mirrors the preflight bin block).
[[bin]]
name = "mzml2mzpeak"
path = "src/main.rs"

# Phase-7 THROWAWAY read-spike (Plan 07-02): the reverse (mzPeak -> imzML) read-path GATE
# harness over the real out/HR2MSI.mzpeak archive. NOT production code — superseded by Phase 8's
# src/reverse/source.rs; committed only for reproducibility (durable evidence lives in
# 07-FINDINGS.md). Declared explicitly to mirror the other bin blocks.
[[bin]]
name = "spike_reverse_read"
path = "src/bin/spike_reverse_read.rs"

[dependencies]
# --- CORE compatibility crates: pinned EXACTLY (these fracture the arrow/mzdata
# type graph if they drift). Versions mirror mzpeak_prototyping's own Cargo.toml. ---
arrow = "=57.0.0"
parquet = { version = "=57.0.0", features = ["encryption"] }
zip = "=4.1.0"
# imzml is the NON-default addition that makes `mzdata::io::imzml` exist; the other
# features mirror upstream so the unioned single copy is identical to upstream + imzml.
# 0.64.2: the latest mzdata (main HEAD f9abc00) — NOT yet published on crates.io (max published is
# 0.64.0), so it is VENDORED as an unmodified pinned snapshot via [patch.crates-io] below. Satisfies
# upstream mzpeak_prototyping@a5c222c's `mzdata = 0.64.1` (^0.64) requirement; both unify to one copy.
# Clean snapshot, no patches (our former SONAR/ion-mobility patch is upstreamed in main — see the
# [patch.crates-io] note below). Drop the vendoring once 0.64.2 is published to crates.io.
mzdata = { version = "=0.64.2", features = ["imzml", "serde", "bruker_tdf", "nalgebra", "zstd", "numpress"] }
mzpeaks = "=1.0.9"

# --- Write path: git-only reference implementation, pinned to a CONCRETE commit rev.
# default-features = false drops the async/object_store/opendal/tokio stack
# (STACK.md local-file-only v1 variant). ---
mzpeak_prototyping = { git = "https://github.com/HUPO-PSI/mzPeak", rev = "a5c222c", default-features = false }

# --- Integrity digest crates (Plan 02-02, IN-07): canonical RustCrypto LEAF crates,
# pure-Rust with NO shared transitive types with arrow/mzdata, so they cannot fracture
# the dep graph. Pinned with `=`. The streaming Update/finalize API hashes the .ibd in
# fixed chunks (never loading the 815MB sidecar). `md-5` is imported as `md5`. ---
# --- SDRF reader (Phase 31, SM-01/02/03): pure-Rust CSV reader, pinned with `=`.
# Pure-Rust leaf — shares NO transitive types with arrow/mzdata; cannot fracture the
# type graph. Pinned with `=` per the CLAUDE.md stack discipline. Legitimacy verified:
# image-rs-adjacent maintainer (rust-lang/csv-rs), multi-million downloads on crates.io.
# Unifies with any arrow-csv transitive copy at the same version; verify via
# `cargo tree -d` (no duplicates expected). The ONLY new dep added in Phase 31. ---
csv = "=1.3.1"

sha1 = "=0.10.6"
md-5 = "=0.10.6"
sha2 = "=0.10.9"

# --- Structurally-aware imzML <scanSettings> geometry parse (Phase 3, D-02). Pinned
# EXACTLY to mzdata's transitive 0.30.0 so the dep graph keeps ONE copy (a drifted
# version fractures the shared encoding/CURIE type graph — RESEARCH Pitfall 3).
#
# NOTE (deviation, Plan 03-01 Task 1): the planned `features = ["encoding"]` CANNOT be
# enabled. In quick-xml 0.30 the `encoding` feature is NOT purely additive on the shared
# single copy — it gates `Attribute::unescape_value`/`unescape_value_with` behind
# `#[cfg(not(feature = "encoding"))]`. The vendored mzdata 0.63.3 reader (imzml + mzml)
# calls `attr.unescape_value()` in ~24 places, so unioning `encoding` onto the one shared
# copy STRIPS that method and breaks mzdata's own compilation (48 E0599 errors). We
# therefore depend on quick-xml WITHOUT `encoding`. The ISO-8859-1 imzML prolog is then
# honored by the geometry parser (Plan 03-02) via explicit `encoding_rs` Latin-1 decode of
# bounded bytes — the fallback already sanctioned in RESEARCH "Alternatives Considered"
# (encoding_rs 0.8.35 is already in the tree transitively via mzdata).
quick-xml = "=0.30.0"

# --- ISO-8859-1 (Latin-1) decode of bounded <scanSettings> attribute bytes (Plan 03-02).
# Because the quick-xml `encoding` feature is intentionally OFF (Plan 03-01 deviation — it
# strips Attribute::unescape_value from the shared mzdata copy), the geometry parser decodes
# raw cvParam attribute bytes explicitly via encoding_rs (WINDOWS_1252, a byte-lossless
# ISO-8859-1 superset that never errors on high bytes). Pinned EXACTLY to mzdata's transitive
# 0.8.35 so the single shared copy is preserved (verified via `cargo tree -i encoding_rs`).
# This is the RESEARCH "Alternatives Considered" sanctioned fallback, already in the tree. ---
encoding_rs = "=0.8.35"

# --- Serde serialization (Plan 03-03): ImagingMetadata serializes to the metadata.imaging
# serde_json::Value inserted into mzPeak's open FileIndex.metadata map. Both crates are
# CLAUDE.md-sanctioned stack members (serde 1.0.219 / serde_json 1.0.140 minimums) and were
# ALREADY in the dep graph transitively — pinned with `=` at the resolved single-copy
# versions (no new copy, no graph fracture; verified present in Cargo.lock). ---
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

# --- TIFF dimension read (Phase 15, IMG-04): the de-facto pure-Rust TIFF reader
# (image-rs/image-tiff). We use ONLY Decoder::dimensions() (reads the first IFD, no pixel
# decode). default-features=false drops every codec (deflate/jpeg/lzw/fax) so no new
# transitive copy can fracture the arrow/parquet/zip type graph — dimensions need no codecs.
# Pinned EXACTLY to =0.11.3 (CLAUDE.md: match-pins discipline; human-verified legitimacy gate
# cleared — image-rs org crate, 82M+ downloads). ---
tiff = { version = "=0.11.3", default-features = false }

# --- Application-boundary helpers: pinned with `=` at upstream-aligned versions. ---
anyhow = "=1.0.102"
thiserror = "=2.0.18"
clap = { version = "=4.5.38", features = ["derive"] }
log = "=0.4.27"
env_logger = "=0.11.8"
# --- Progress bar (CLI-02): promoted to a DIRECT dependency at the version Cargo.lock
# ALREADY resolves transitively via mzpeak_prototyping, so pinning `=0.17.11` preserves the
# SINGLE resolved copy (verify with `cargo tree -i indicatif`). NOT 0.17.10 (CLAUDE.md's
# table value is stale — the lockfile is at 0.17.11). Binary-only: indicatif is used in the
# CLI (Phase 06-02), never in a library module (mirrors the anyhow binary-only boundary). ---
indicatif = "=0.17.11"

# --- VENDORED SNAPSHOT (CLEAN — no local patches): mzdata 0.64.2 (main HEAD f9abc00) is not yet
# published on crates.io (max published 0.64.0), so we pin a snapshot here. As of mzdata main our
# former B1 patch is FULLY UPSTREAMED: the SONAR scanning-quadrupole arrays MS:1003157/1003158 now
# have dedicated `ArrayType::ScanningQuadrupolePosition{Lower,Upper}BoundMZ` variants + reader
# mappings (better than our old NonStandardDataArray patch), which upstream mzpeak_prototyping HEAD
# also requires. This snapshot is therefore unmodified. Drop the whole [patch] once mzdata 0.64.2 is
# published to crates.io (Phase 31 / DVN-02). ---
# --- Dev-only dependencies (test helpers, not shipped in the library crate). ---
[dev-dependencies]
# tempfile is already in the graph transitively via mzpeak_prototyping@3.27.0;
# declaring it here as a dev-dep pins the shared copy and makes it explicit for test use.
tempfile = "=3.27.0"

[patch.crates-io]
mzdata = { path = "vendor/mzdata" }

# --- VENDORED FORK (mzpeak_prototyping @ HUPO-PSI/mzPeak HEAD a5c222c): now carries exactly ONE
# local patch — `src/chunk_series.rs` (the ArrowArrayChunk intensity/mz index-desync; index the
# filtered `arrow_arrays` by len(), not the source-map enumerate index — else profile ion-mobility
# spectra panic). PR not yet submitted (Phase 22 / UPS-01); drop this edit + the whole [patch] once
# merged (Phase 31 / DVN-01).
#   The other two former patches are GONE — fixed upstream as of a5c222c: (1) the FileEntry
#   `DataKind`/`EntityType` serde asymmetry is fixed by upstream `#[serde(untagged)]` on the `Other`
#   variants (round-trip verified by tests/file_index_roundtrip.rs); (2) the `array_buffer.rs`
#   empty-first-spectrum type mismatch is fixed by the upstream writer rewrite (pwiz corpus now
#   139/139, was 138/139). ---
[patch."https://github.com/HUPO-PSI/mzPeak"]
mzpeak_prototyping = { path = "vendor/mzpeak_prototyping" }
